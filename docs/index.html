<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faltas UNIVAP</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #17181c;
    --text-dim: #6b7280;
    --text-faint: #9aa0ab;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-bg: rgba(37,99,235,0.08);
    --ok: #16a34a;
    --warn: #d97706;
    --risk: #dc2626;
    --ok-bg: rgba(22,163,74,0.12);
    --warn-bg: rgba(217,119,6,0.14);
    --risk-bg: rgba(220,38,38,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d10;
      --surface: #16171b;
      --text: #f2f2f3;
      --text-dim: #9199a5;
      --text-faint: #5b6270;
      --border: #24262c;
      --accent: #5b9bff;
      --accent-bg: rgba(91,155,255,0.12);
      --ok: #4ade80;
      --warn: #fbbf24;
      --risk: #f87171;
      --ok-bg: rgba(74,222,128,0.10);
      --warn-bg: rgba(251,191,36,0.12);
      --risk-bg: rgba(248,113,113,0.12);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

  /* Header */
  header { margin-bottom: 22px; }
  header .hoje { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header .data { color: var(--text-dim); font-size: 14px; margin-top: 2px; }
  header .sync { color: var(--text-faint); font-size: 12.5px; margin-top: 6px; }

  /* Section titles */
  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin: 28px 0 10px;
  }
  .section-title:first-of-type { margin-top: 0; }

  /* Aulas */
  .aula-list { display: flex; flex-direction: column; }
  .aula-row {
    display: flex;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .aula-row:last-child { border-bottom: none; }
  .aula-row.passada { opacity: 0.45; }
  .aula-check { width: 16px; flex-shrink: 0; text-align: center; color: var(--text-faint); font-size: 13px; padding-top: 2px; }
  .aula-body { flex: 1; min-width: 0; }
  .aula-horario { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .aula-nome { font-size: 15.5px; font-weight: 600; margin-top: 1px; line-height: 1.3; }
  .aula-local {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 3px;
    display: inline-block;
    cursor: pointer;
  }
  .aula-local:active { opacity: 0.6; }
  .aula-local.add-btn { color: var(--accent); }

  .aula-destaque {
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--accent-bg);
    border: 1px solid transparent;
    margin: 2px 0;
  }
  .aula-destaque .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .aula-destaque .aula-horario { color: var(--text-dim); }

  .encerradas {
    color: var(--text-faint);
    font-size: 13.5px;
    padding: 4px 0 2px;
  }
  .encerradas .linha { display: flex; gap: 8px; padding: 3px 0; }
  .encerradas .linha span.h { font-variant-numeric: tabular-nums; width: 44px; flex-shrink: 0; }
  .vazio { color: var(--text-dim); font-size: 14.5px; padding: 6px 0; }

  /* Faltas */
  .falta-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .falta-item:last-child { border-bottom: none; }
  .falta-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .falta-nome { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .falta-count { font-size: 14.5px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
  .falta-bar-bg { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .falta-bar-fill { height: 100%; border-radius: 3px; }
  .falta-meta { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }
  .falta-meta b { font-weight: 700; }
  .falta-meta.ok b { color: var(--ok); }
  .falta-meta.warn b { color: var(--warn); }
  .falta-meta.risk b { color: var(--risk); }

  .erro { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 14px; }

  /* Semana */
  .dia-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    margin-bottom: 4px;
    scrollbar-width: none;
  }
  .dia-tabs::-webkit-scrollbar { display: none; }
  .dia-tab {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
  }
  .dia-tab.ativo { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dia-tab .ponto {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    margin-left: 6px;
    opacity: 0.55;
    vertical-align: middle;
  }

  /* Bottom sheet */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
    z-index: 50;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--surface);
    width: 100%; max-width: 560px;
    border-radius: 16px 16px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .22s ease;
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  .sheet h3 { margin: 0 0 16px; font-size: 15.5px; font-weight: 700; }
  .sheet label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; margin-top: 12px; }
  .sheet label:first-of-type { margin-top: 0; }
  .sheet input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--text);
  }
  .sheet input:focus { outline: none; border-color: var(--accent); }
  .sheet-actions { display: flex; justify-content: flex-end; gap: 18px; margin-top: 20px; }
  .sheet-actions button {
    background: none; border: none; font-size: 14.5px; font-weight: 600;
    padding: 8px 4px; cursor: pointer; color: var(--text-dim);
  }
  .sheet-actions button.primary { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="hoje">Hoje</div>
      <div class="data" id="dataAtual">—</div>
      <div class="sync" id="syncInfo"></div>
    </header>

    <div id="content"></div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet">
      <h3 id="sheetTitulo">Disciplina</h3>
      <label for="sheetBloco">Bloco</label>
      <input id="sheetBloco" type="text" placeholder="Ex: B" maxlength="40">
      <label for="sheetSala">Sala</label>
      <input id="sheetSala" type="text" placeholder="Ex: Laboratório 03" maxlength="60">
      <div class="sheet-actions">
        <button id="sheetCancelar">Cancelar</button>
        <button class="primary" id="sheetSalvar">Salvar</button>
      </div>
    </div>
  </div>

<script>
const DIAS_PT = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const MESES_PT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

const DIAS_ABREV = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

let DATA = null;
let sheetCodigoAtual = null;
let selectedDia = new Date().getDay();

function getClassLocations() {
  try {
    const raw = localStorage.getItem('classLocations');
    const parsed = raw ? JSON.parse(raw) : {};
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (e) {
    return {};
  }
}
function getClassLocation(codigo) {
  return getClassLocations()[codigo] || null;
}
function saveClassLocation(codigo, location) {
  const all = getClassLocations();
  all[codigo] = location;
  localStorage.setItem('classLocations', JSON.stringify(all));
}
function removeClassLocation(codigo) {
  const all = getClassLocations();
  delete all[codigo];
  localStorage.setItem('classLocations', JSON.stringify(all));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function formatDataHoje() {
  const now = new Date();
  const dia = DIAS_PT[now.getDay()];
  return `${dia}, ${now.getDate()} de ${MESES_PT[now.getMonth()]}`;
}

async function load() {
  const contentEl = document.getElementById('content');
  document.getElementById('dataAtual').textContent = formatDataHoje();

  try {
    const res = await fetch('data.json?_=' + Date.now());
    if (!res.ok) throw new Error('sem dados');
    DATA = await res.json();
  } catch (e) {
    document.getElementById('syncInfo').textContent = '';
    contentEl.innerHTML = '<div class="erro">Ainda não há dados. O cron roda 1x por dia — aguarde a primeira execução.</div>';
    return;
  }

  const dt = new Date(DATA.atualizado_em);
  document.getElementById('syncInfo').textContent = isNaN(dt) ? '' :
    `Atualizado hoje às ${dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`;

  render();
}

function render() {
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = renderHoje() + renderSemana() + renderFaltas();
  attachLocalHandlers();
}

function minutosParaTexto(min) {
  if (min < 60) return `${min} MIN`;
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? `${h}H` : `${h}H ${m}MIN`;
}

function getAulasDoDia(diaSemana) {
  const grade = DATA.grade || [];
  return grade
    .filter(a => a.dia_semana_js === diaSemana)
    .map(a => ({ ...a, inicioMin: toMinutes(a.inicio), fimMin: toMinutes(a.fim) }))
    .sort((a, b) => a.inicioMin - b.inicioMin);
}

function renderHoje() {
  const now = new Date();
  const diaSemana = now.getDay();
  const agoraMin = now.getHours() * 60 + now.getMinutes();
  const aulasHoje = getAulasDoDia(diaSemana);

  let html = '<div class="section-title">Hoje</div>';

  if (aulasHoje.length === 0) {
    return html + '<div class="vazio">Nenhuma aula hoje.</div>';
  }

  const todasEncerradas = aulasHoje.every(a => a.fimMin <= agoraMin);

  if (todasEncerradas) {
    html += '<div class="encerradas">';
    aulasHoje.forEach(a => {
      html += `<div class="linha"><span class="h">✓ ${a.inicio}</span><span>${escapeHtml(nomeCurto(a.disciplina))}</span></div>`;
    });
    html += '<div style="margin-top:6px;">Aulas encerradas por hoje.</div></div>';
    return html;
  }

  const atual = aulasHoje.find(a => agoraMin >= a.inicioMin && agoraMin < a.fimMin);
  const proxima = !atual ? aulasHoje.find(a => a.inicioMin > agoraMin) : null;

  html += '<div class="aula-list">';
  aulasHoje.forEach(a => {
    const isPassada = a.fimMin <= agoraMin;
    const isAtual = atual && atual === a;
    const isProxima = proxima && proxima === a;

    if (isAtual || isProxima) {
      const tag = isAtual ? 'AGORA' : `PRÓXIMA · EM ${minutosParaTexto(a.inicioMin - agoraMin)}`;
      html += `
        <div class="aula-destaque">
          <div class="tag">${tag}</div>
          ${renderCorpoAula(a, false)}
        </div>`;
    } else {
      html += `<div class="aula-row ${isPassada ? 'passada' : ''}">
        <div class="aula-check">${isPassada ? '✓' : ''}</div>
        <div class="aula-body">${renderCorpoAula(a, true)}</div>
      </div>`;
    }
  });
  html += '</div>';
  return html;
}

function renderSemana() {
  const grade = DATA.grade || [];
  if (grade.length === 0) return '';

  const hojeIdx = new Date().getDay();
  const diasComAula = new Set(grade.map(a => a.dia_semana_js));

  let html = '<div class="section-title">Semana</div><div class="dia-tabs">';
  for (let i = 0; i < 7; i++) {
    const ativo = i === selectedDia ? 'ativo' : '';
    const marcador = diasComAula.has(i) ? '<span class="ponto"></span>' : '';
    html += `<button class="dia-tab ${ativo}" data-dia="${i}">${DIAS_ABREV[i]}${i === hojeIdx ? ' · hoje' : ''}${marcador}</button>`;
  }
  html += '</div>';

  const aulas = getAulasDoDia(selectedDia);
  if (aulas.length === 0) {
    return html + '<div class="vazio">Nenhuma aula nesse dia.</div>';
  }

  const now = new Date();
  const agoraMin = now.getHours() * 60 + now.getMinutes();
  const ehHoje = selectedDia === hojeIdx;
  const atual = ehHoje ? aulas.find(a => agoraMin >= a.inicioMin && agoraMin < a.fimMin) : null;
  const proxima = ehHoje && !atual ? aulas.find(a => a.inicioMin > agoraMin) : null;

  html += '<div class="aula-list">';
  aulas.forEach(a => {
    const isPassada = ehHoje && a.fimMin <= agoraMin;
    const isAtual = atual === a;
    const isProxima = proxima === a;

    if (isAtual || isProxima) {
      const tag = isAtual ? 'AGORA' : `PRÓXIMA · EM ${minutosParaTexto(a.inicioMin - agoraMin)}`;
      html += `<div class="aula-destaque"><div class="tag">${tag}</div>${renderCorpoAula(a, false)}</div>`;
    } else {
      html += `<div class="aula-row ${isPassada ? 'passada' : ''}">
        <div class="aula-check">${isPassada ? '✓' : ''}</div>
        <div class="aula-body">${renderCorpoAula(a, true)}</div>
      </div>`;
    }
  });
  html += '</div>';
  return html;
}

function nomeCurto(disciplina) {
  const partes = disciplina.split(' - ');
  return partes.length > 1 ? partes.slice(1).join(' - ') : disciplina;
}

function renderCorpoAula(a, comHorarioLinha) {
  const local = getClassLocation(a.codigo);
  const localHtml = local
    ? `<span class="aula-local" data-codigo="${escapeHtml(a.codigo)}" data-nome="${escapeHtml(nomeCurto(a.disciplina))}">${escapeHtml([local.block && 'Bloco ' + local.block, local.room].filter(Boolean).join(' · '))}</span>`
    : `<span class="aula-local add-btn" data-codigo="${escapeHtml(a.codigo)}" data-nome="${escapeHtml(nomeCurto(a.disciplina))}">+ Adicionar sala</span>`;

  return `
    ${comHorarioLinha ? `<div class="aula-horario">${a.inicio} — ${a.fim}</div>` : `<div class="aula-horario">${a.inicio} — ${a.fim}</div>`}
    <div class="aula-nome">${escapeHtml(nomeCurto(a.disciplina))}</div>
    ${localHtml}
  `;
}

function renderFaltas() {
  const disciplinas = DATA.disciplinas || [];
  if (disciplinas.length === 0) return '';

  let html = '<div class="section-title">Faltas</div>';
  disciplinas.forEach(d => {
    const pct = d.percentual_faltas ?? 0;
    let nivel = 'ok', cor = 'var(--ok)';
    if (pct >= 20) { nivel = 'risk'; cor = 'var(--risk)'; }
    else if (pct >= 12) { nivel = 'warn'; cor = 'var(--warn)'; }

    const dias = d.pode_faltar_dias;
    const diasTexto = dias != null ? `Pode faltar mais ${dias} dia${dias === 1 ? '' : 's'}` : `Pode faltar mais ${d.pode_faltar_ainda ?? '—'} aulas`;

    html += `
      <div class="falta-item">
        <div class="falta-head">
          <div class="falta-nome">${escapeHtml(nomeCurto(d.disciplina))}</div>
          <div class="falta-count">${d.faltas ?? '—'}</div>
        </div>
        <div class="falta-bar-bg"><div class="falta-bar-fill" style="width:${Math.min(pct,100)}%;background:${cor}"></div></div>
        <div class="falta-meta ${nivel}"><b>${pct}%</b> · ${diasTexto}</div>
      </div>`;
  });
  return html;
}

function attachLocalHandlers() {
  document.querySelectorAll('.aula-local').forEach(el => {
    el.addEventListener('click', () => abrirSheet(el.dataset.codigo, el.dataset.nome));
  });
  document.querySelectorAll('.dia-tab').forEach(el => {
    el.addEventListener('click', () => {
      selectedDia = Number(el.dataset.dia);
      render();
    });
  });
}

function abrirSheet(codigo, nomeDisciplina) {
  sheetCodigoAtual = codigo;
  document.getElementById('sheetTitulo').textContent = nomeDisciplina;
  const atual = getClassLocation(codigo) || {};
  document.getElementById('sheetBloco').value = atual.block || '';
  document.getElementById('sheetSala').value = atual.room || '';
  document.getElementById('sheetOverlay').classList.add('open');
}

function fecharSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  sheetCodigoAtual = null;
}

document.getElementById('sheetCancelar').addEventListener('click', fecharSheet);
document.getElementById('sheetOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'sheetOverlay') fecharSheet();
});
document.getElementById('sheetSalvar').addEventListener('click', () => {
  if (!sheetCodigoAtual) return;
  const block = document.getElementById('sheetBloco').value.trim();
  const room = document.getElementById('sheetSala').value.trim();
  if (!block && !room) {
    removeClassLocation(sheetCodigoAtual);
  } else {
    saveClassLocation(sheetCodigoAtual, { block, room });
  }
  fecharSheet();
  render();
});

load();
</script>
</body>
</html>
